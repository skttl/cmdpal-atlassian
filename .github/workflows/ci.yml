name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Run metadata and keyword checks
        run: dotnet run --project tests/SearchChecks
      - name: Build development package
        shell: pwsh
        run: ./scripts/build.ps1
  broker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: broker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: broker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Validate Worker bundle
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy --dry-run --outdir dist/worker
